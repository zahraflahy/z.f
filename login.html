<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود</title>
    <link rel="stylesheet" href="css/setting.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-top">
          <a href="index.html" class="login-back">→</a>
          <img src="images/footer/digikala.svg.png" alt="" class="login-logo" />
        </div>
        <h1 class="login-title">ورود یا ثبت نام در دیجی کالا</h1>
        <p class="login-subtitle">
          لطفا شماره موبایل یا ایمیل خود را وارد کنید
        </p>
        <form class="login-form">
          <input
            type="text"
            class="login-input"
            placeholder="شماره موبایل یا پست الکترونیک"
          />
          <button type="submit" class="login-btn">ورود به دیجی کالا</button>
        </form>
        <p class="login-note">
          ورود شما به معنای پذیرش
          <a href="#">شرایط دیجی کالا</a>
          و
          <a href="#">قوانین حریم خصوصی</a>
          است
        </p>
      </div>
    </div>
  </body>
</html>
